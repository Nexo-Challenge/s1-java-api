spring:
  application:
    name: nexo-api
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
